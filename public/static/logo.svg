<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Nexa">
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF3B4A"/>
      <stop offset="100%" stop-color="#F2B705"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D35E"/>
      <stop offset="100%" stop-color="#C99A2E"/>
    </linearGradient>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1A1A1D"/>
      <stop offset="100%" stop-color="#0B0B0C"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#C99A2E" stroke-width="1.5" opacity="0.6"/>

  <!-- hoja de loto: la N renace de ella -->
  <path d="M46 152 C 30 146, 24 130, 34 116 C 46 124, 52 138, 46 152 Z" fill="#1E8F5F"/>
  <path d="M154 152 C 170 146, 176 130, 166 116 C 154 124, 148 138, 154 152 Z" fill="#1E8F5F" opacity="0.85"/>

  <!-- letra N -->
  <rect x="40" y="40" width="24" height="120" rx="3" fill="url(#gold)"/>
  <rect x="136" y="40" width="24" height="120" rx="3" fill="url(#gold)"/>
  <polygon points="64,40 88,40 136,160 112,160" fill="url(#flame)"/>

  <!-- llamas: puntas de reborn -->
  <path d="M46 40 C 40 30, 44 20, 52 14 C 56 24, 54 34, 46 40 Z" fill="url(#flame)"/>
  <path d="M154 40 C 148 30, 152 20, 160 14 C 164 24, 162 34, 154 40 Z" fill="url(#flame)"/>

  <!-- chispa -->
  <circle cx="150" cy="46" r="5" fill="#FFF7E6"/>
</svg>
