  <!-- trazos de circuito -->
  <g stroke="#E8C158" stroke-width="1.6" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M 150 36 L 150 26 L 160 26"/>
    <path d="M 196 88 L 206 84 L 206 74"/>
  </g>
  <circle cx="160" cy="26" r="2.2" fill="#E8C158"/>
  <circle cx="206" cy="74" r="2.2" fill="#E8C158"/>

  <!-- koi estilizado, saliendo del fuego hacia el loto -->
  <path d="M 152 150 C 168 156, 178 172, 172 190 C 167 203, 151 209, 138 202 C 148 196, 154 184, 150 172 C 148 164, 149 156, 152 150 Z" fill="url(#koiBody)"/>
  <path d="M 172 190 C 180 192, 189 189, 194 181 C 190 190, 191 200, 186 207 C 182 200, 176 195, 172 190 Z" fill="#E8531F"/>
  <circle cx="156" cy="159" r="2.6" fill="#2A2A2A"/>

  <!-- loto -->
  <g>
    <path d="M120 158 C 94 153, 74 134, 70 108 C 70 101, 73 96, 78 93 C 91 109, 105 130, 120 144 Z" fill="url(#petalOuter)"/>
    <path d="M120 161 C 146 156, 166 137, 170 111 C 170 104, 167 99, 162 96 C 149 112, 135 133, 120 147 Z" fill="url(#petalOuter)"/>
    <path d="M120 154 C 100 146, 87 127, 86 104 C 87 97, 90 93, 95 91 C 104 108, 112 129, 120 142 Z" fill="url(#petalInner)"/>
    <path d="M120 154 C 140 146, 153 127, 154 104 C 153 97, 150 93, 145 91 C 136 108, 128 129, 120 142 Z" fill="url(#petalInner)"/>
    <path d="M120 150 C 111 133, 107 114, 110 95 C 112 88, 116 84, 120 82 C 124 84, 128 88, 130 95 C 133 114, 129 133, 120 150 Z" fill="url(#petalInner)"/>
  </g>

  <!-- joya central -->
  <circle cx="120" cy="121" r="13" fill="url(#jewel)"/>
  <circle cx="115" cy="115" r="4.2" fill="#FFFFFF" opacity="0.8"/>
</svg>
