    <path d="M 126.5 178.0 C 127.0 192.0 124.2 208.0 114.9 217.9 C 117.9 208.0 116.5 192.0 113.5 178.0 Z" fill="url(#flameOuter)"/>
    <path d="M 153.3 167.7 C 160.3 175.8 163.9 187.6 167.9 193.8 C 158.4 190.8 151.2 181.1 144.7 172.7 Z" fill="url(#flameMid)"/>
    <path d="M 173.5 143.4 C 185.9 149.9 198.3 160.4 202.2 173.4 C 195.2 165.8 180.6 159.0 167.0 154.6 Z" fill="url(#flameOuter)"/>
    <path d="M 178.0 115.0 C 188.5 113.0 200.5 115.8 207.9 115.4 C 200.5 122.1 188.5 123.5 178.0 125.0 Z" fill="url(#flameMid)"/>
    <path d="M 167.0 85.4 C 178.9 77.9 194.1 72.4 207.3 75.5 C 197.3 77.8 184.1 87.0 173.5 96.6 Z" fill="url(#flameOuter)"/>
    <path d="M 144.7 67.3 C 148.2 57.2 156.6 48.2 160.0 41.6 C 162.1 51.3 157.3 62.4 153.3 72.3 Z" fill="url(#flameMid)"/>
